name: Capstone Stock Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'

jobs:
  validate-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Validate dataset
        run: python ci/validate_dataset.py

      - name: Run model comparison pipeline
        run: python ci/run_capstone_models.py

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capstone-stock-results
          path: artifacts/
